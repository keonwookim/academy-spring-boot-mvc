<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>게시물 수정</title>
</head>
<body>
<form method="post" action="/post/modify">
    <input type="hidden" name="id" value="${post.id}" />
    제목: <input type="text" name="title" th:value="${post.title}" /><br />
    내용: <textarea name="content" rows="10" cols="80" th:text="${post.content}">"</textarea><br />

    <input type="submit" />
</form>
</body>
</html>
